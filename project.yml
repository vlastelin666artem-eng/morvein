name: Morvein
options:
  bundleIdPrefix: com.morvein
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Morvein:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: MorveinWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morvein.app
        PRODUCT_NAME: Morvein
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Морвейн
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
  MorveinWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morvein.app.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MorveinWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
