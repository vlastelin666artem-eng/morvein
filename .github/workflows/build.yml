name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: |
          xcodebuild -project Morvein.xcodeproj -scheme Morvein -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=«» build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Morvein.app Payload/
          zip -r Morvein.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Morvein-ipa
          path: Morvein.ipa
